<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Client | PRODIAG.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 600: '#1d4ed8' } } } } }
    </script>
</head>
<body class="bg-zinc-50 font-sans h-screen flex flex-col">

    <nav class="p-6">
        <a href="index.html" class="text-xl font-black tracking-tight text-zinc-950 flex items-center gap-2">
            <svg class="w-6 h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Retour
        </a>
    </nav>

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-zinc-200/50 p-10 border border-zinc-100">
            
            <div class="text-3xl font-black tracking-tight text-center text-zinc-950 mb-3">
                PRO<span class="text-brand-600">DIAG.</span>
            </div>
            <p class="text-center text-sm text-zinc-500 mb-8 font-medium">
                Accédez à vos commandes, factures et suivis de livraison.
            </p>

            <form class="space-y-5" onsubmit="event.preventDefault(); alert('Lien envoyé vers le Portail Stripe !');">
                <div>
                    <label for="email" class="block text-sm font-bold text-zinc-900 mb-2">Adresse e-mail de facturation</label>
                    <input type="email" id="email" class="w-full px-5 py-4 rounded-xl border-2 border-zinc-100 focus:outline-none focus:border-zinc-950 focus:ring-0 transition-all font-medium" placeholder="jean.dupont@email.com" required>
                </div>

                <!-- Ce bouton redirigera vers l'URL de ton portail client Stripe -->
                <button type="submit" class="w-full bg-zinc-950 hover:bg-zinc-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-zinc-900/20">
                    Recevoir mon accès sécurisé
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-zinc-100 text-center">
                <p class="text-xs text-zinc-400 font-medium">
                    Un lien magique vous sera envoyé. Aucun mot de passe requis.<br>
                    Sécurisé par <span class="font-bold text-zinc-600">Stripe</span>.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
