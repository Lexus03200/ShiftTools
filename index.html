<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftTools | Équipement Technique & Outils d'Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { zinc: { 850: '#1f2023', 900: '#18181b', 950: '#09090b' }, brand: { 600: '#2563eb' } }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 top-0 bg-white/85 backdrop-blur-md border-b border-zinc-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-tight text-zinc-950">
                Shift<span class="text-brand-600">Tools.</span>
            </a>
            <div class="hidden md:flex gap-8 text-sm font-semibold text-zinc-600">
                <a href="index.html" class="text-zinc-950">Catalogue</a>
                <a href="login.html" class="hover:text-zinc-950 transition-colors">Espace Client</a>
            </div>
            <button onclick="openCart()" class="flex items-center gap-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-900 px-4 py-2 rounded-full text-sm font-semibold transition-all">
                <span>Panier</span>
                <span id="cart-count" class="bg-zinc-950 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- En-tête de collection -->
    <header class="pt-32 pb-16 max-w-7xl mx-auto px-6">
        <div class="max-w-2xl">
            <span class="text-xs font-bold uppercase tracking-widest text-brand-600 bg-brand-600/10 px-3 py-1 rounded-full">Matériel d'Atelier & Solutions</span>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight text-zinc-950 mt-4 mb-4">L'outillage technique sans compromis.</h1>
            <p class="text-zinc-600 text-lg">Conçu pour résoudre de vrais problèmes en atelier. Stock européen, expédition rapide.</p>
        </div>
    </header>

    <!-- Grille des Produits (Générée dynamiquement) -->
    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div id="product-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Injecté par JavaScript -->
        </div>
    </main>

    <!-- Panier Latéral -->
    <div id="cart-overlay" class="fixed inset-0 bg-zinc-950/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300" onclick="closeCart()"></div>
    <div id="cart-panel" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50">
            <h2 class="text-xl font-black tracking-tight">Votre Panier</h2>
            <button onclick="closeCart()" class="p-2 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-full">✕</button>
        </div>
        <div class="flex-1 p-6 overflow-y-auto bg-white" id="cart-items">
            <p class="text-zinc-500 text-center mt-12 font-medium">Votre panier est vide.</p>
        </div>
        <div class="p-6 border-t border-zinc-100 bg-zinc-50">
            <div class="flex justify-between mb-4 font-bold text-zinc-950">
                <span>Total</span>
                <span id="cart-total">0,00 €</span>
            </div>
            <a href="#" id="checkout-btn" class="block w-full bg-zinc-950 text-white text-center py-4 rounded-xl font-bold hover:bg-zinc-800 transition-colors opacity-50 pointer-events-none">
                Valider la commande (Stripe)
            </a>
        </div>
    </div>

    <!-- Script de gestion du catalogue et du panier -->
    <script>
        // Ta liste de produits évolutive
        const produits = [
            {
                id: 1,
                nom: "Scanner OBD2 Professionnel",
                desc: "Lecture des calculateurs, effacement des défauts et données en temps réel.",
                prix: 34.90,
                ancienPrix: 59.90,
                image: "https://via.placeholder.com/600/f4f4f5/71717a?text=OBD2+Pro",
                lienFiche: "produit.html?id=1"
            },
            {
                id: 2,
                nom: "Kit d'Extraction de Cosses Faisceau",
                desc: "Jeu de clés en acier fin pour libérer proprement les pins et connecteurs.",
                prix: 24.90,
                ancienPrix: 39.90,
                image: "https://via.placeholder.com/600/f4f4f5/71717a?text=Extracteur+Cosses",
                lienFiche: "produit.html?id=2"
            },
            {
                id: 3,
                nom: "Ruban Tissu Adhésif Haute Température",
                desc: "Finition d'origine constructeur pour la réfection des faisceaux moteur.",
                prix: 14.90,
                ancienPrix: 24.90,
                image: "https://via.placeholder.com/600/f4f4f5/71717a?text=Ruban+Tissu",
                lienFiche: "produit.html?id=3"
            }
        ];

        // Affichage dynamique de la grille
        const grid = document.getElementById('product-grid');
        grid.innerHTML = produits.map(p => `
            <div class="bg-white rounded-3xl border border-zinc-200 overflow-hidden flex flex-col justify-between group hover:border-zinc-400 transition-all shadow-sm">
                <a href="${p.lienFiche}" class="block aspect-square bg-zinc-100 overflow-hidden relative">
                    <img src="${p.image}" alt="${p.nom}" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500">
                </a>
                <div class="p-6 flex-1 flex flex-col justify-between">
                    <div>
                        <a href="${p.lienFiche}"><h3 class="font-bold text-lg text-zinc-950 mb-2 hover:text-brand-600 transition-colors">${p.nom}</h3></a>
                        <p class="text-sm text-zinc-500 mb-6">${p.desc}</p>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-zinc-100">
                        <div>
                            <span class="text-xl font-black text-zinc-950">${p.prix.toFixed(2)} €</span>
                            <span class="text-xs text-zinc-400 line-through ml-2">${p.ancienPrix.toFixed(2)} €</span>
                        </div>
                        <a href="${p.lienFiche}" class="bg-zinc-950 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors">
                            Voir
                        </a>
                    </div>
                </div>
            </div>
        `).join('');

        function openCart() {
            document.getElementById('cart-overlay').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('cart-overlay').classList.remove('opacity-0');
                document.getElementById('cart-panel').classList.remove('translate-x-full');
            }, 10);
        }
        function closeCart() {
            document.getElementById('cart-overlay').classList.add('opacity-0');
            document.getElementById('cart-panel').classList.add('translate-x-full');
            setTimeout(() => { document.getElementById('cart-overlay').classList.add('hidden'); }, 300);
        }
    </script>
</body>
</html>
